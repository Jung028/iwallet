version: '3.8'

services:
  zookeeper-iwallet:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-iwallet
    restart: unless-stopped
    ports:
      - "2183:2181"   # expose ZK for iWallet on host 2183
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-iwallet:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-iwallet
    restart: unless-stopped
    depends_on:
      - zookeeper-iwallet
    ports:
      - "9094:9094"   # Map container port 9092 to host 9094
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-iwallet:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  loki:
    image: grafana/loki:2.9.0
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.0
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - /var/log:/var/log
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml

  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # Jaeger gRPC (for direct Jaeger-format export)
      - "4319:4318"   # Jaeger OTLP HTTP — for services that can't use the otel-collector
    # Internal OTLP ports 4317/4318 stay inside the Docker network;
    # host ports 4317/4318 are owned by itracer-tempo.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC  — Java agent connects here
      - "4318:4318" # OTLP HTTP  — Java agent connects here
      - "8888:8888" # Prometheus metrics exposed by the collector
      - "8889:8889" # Prometheus exporter metrics
    depends_on:
      jaeger:
        condition: service_healthy
      loki:
        condition: service_started
